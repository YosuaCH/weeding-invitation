<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weeding Invite</title>
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <!-- opentype -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.3/dist/opentype.min.js"></script>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Scripts -->
    <script src="assets/js/hero_text_animation.js" defer></script>
    <script src="assets/js/events_animation.js" defer></script>
    <script src="assets/js/audio.js" defer></script>
  </head>
  <body class="bg-black text-white font-sans overflow-hidden">
    <!-- Hero Section -->
    <section class="relative h-screen w-full flex items-center justify-center">
      <!-- Background Video -->
      <div class="absolute inset-0">
        <video playsinline autoplay muted class="w-full h-full object-cover">
          <source src="assets/video/flower.mp4" type="video/mp4" />
        </video>
        <!-- Overlay -->
        <div class="absolute inset-0 bg-black/40"></div>
      </div>

      <!-- Content (Animates into Navbar) -->
      <div class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none">
        <div id="hero-content" class="text-center px-4 w-full max-w-4xl pointer-events-auto">
        <p
          id="sub-title"
          class="opacity-0 text-white tracking-[0.3em] text-sm md:text-base mb-4"
        >
          THE WEDDING OF
        </p>

        <div id="name-wrapper" class="opacity-0">
          <svg
            id="name"
            class="w-[clamp(280px,72vw,640px)] h-auto overflow-visible block mx-auto"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 160"
          >
            <defs>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="3" result="b" />
                <feMerge>
                  <feMergeNode in="b" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
          </svg>
        </div>

        <!-- Divider -->
        <div
          id="line"
          class="w-0 h-[1px] bg-white mx-auto my-5 opacity-50"
        ></div>

        <p
          id="date"
          class="opacity-0 text-white tracking-[0.25em] text-xs md:text-sm"
        >
          25 . 12 . 2026
        </p>
        </div>
      </div>
    </section>

    <!-- Our Events Section -->
    <section
      id="events-section"
      class="relative bg-white text-black py-20 min-h-screen hidden-initially"
    >
      <div class="container mx-auto px-4">
        <h2
          class="text-4xl md:text-5xl font-serif text-center mb-16 tracking-widest uppercase"
        >
          Rangkaian Acara
        </h2>

        <!-- Mobile Layout (Stacked) -->
        <div class="block md:hidden space-y-12">
          <!-- Event 1 Mobile -->
          <article>
            <div
              class="w-full aspect-[3/4] bg-neutral-200 mb-4 rounded overflow-hidden relative group"
            >
              <!-- Placeholder for Holy Matrimony image -->
              <div
                class="absolute inset-0 bg-[#e6e2dd] flex items-center justify-center transition-opacity duration-500"
              >
                <span class="text-neutral-400 font-serif italic text-xl"
                  >Holy Matrimony Photo</span
                >
              </div>
              <div
                class="absolute inset-0 bg-[#d5cfc7] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500"
              >
                <span class="text-neutral-500 font-serif italic text-xl"
                  >Alternate Photo</span
                >
              </div>
            </div>
            <div class="text-center">
              <h3 class="text-2xl font-serif mb-2"></h3>
              <p class="text-sm text-neutral-600 mb-1"></p>
              <p class="text-sm text-neutral-600"></p>
            </div>
          </article>

          <!-- Event 2 Mobile -->
          <article>
            <div
              class="w-full aspect-[3/4] bg-neutral-200 mb-4 rounded overflow-hidden relative group"
            >
              <!-- Placeholder for Wedding Reception image -->
              <div
                class="absolute inset-0 bg-[#3a444d] flex items-center justify-center transition-opacity duration-500"
              >
                <span class="text-neutral-300 font-serif italic text-xl"></span>
              </div>
              <div
                class="absolute inset-0 bg-[#2a3239] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500"
              >
                <span class="text-neutral-400 font-serif italic text-xl"></span>
              </div>
            </div>
            <div class="text-center">
              <h3 class="text-2xl font-serif mb-2"></h3>
              <p class="text-sm text-neutral-600 mb-1"></p>
              <p class="text-sm text-neutral-600"></p>
            </div>
          </article>

          <!-- Event 3 Mobile -->
          <article>
            <div
              class="w-full aspect-[3/4] bg-neutral-200 mb-4 rounded overflow-hidden relative group"
            >
              <!-- Placeholder for Intimate Dinner image -->
              <div
                class="absolute inset-0 bg-[#2d3a3a] flex items-center justify-center transition-opacity duration-500"
              >
                <span class="text-neutral-300 font-serif italic text-xl"></span>
              </div>
              <div
                class="absolute inset-0 bg-[#1f2929] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500"
              >
                <span class="text-neutral-400 font-serif italic text-xl"></span>
              </div>
            </div>
            <div class="text-center"></div>
          </article>
        </div>

        <!-- Desktop Layout (Pinned Scroll) -->
        <div class="hidden md:block relative w-full events-scroll-wrapper">
          <!-- Info Container (Pinned via GSAP) -->
          <div
            id="event-info-pin"
            class="absolute top-0 left-0 w-full h-screen pointer-events-none z-30 pt-[4vh]"
          >
            <div
              class="container mx-auto px-0 grid grid-cols-3 gap-4 items-center w-full"
            >
              <!-- Empty Left Col -->
              <div></div>

              <!-- Center Col (Pinned Text) -->
              <div class="flex items-center justify-center pointer-events-auto">
                <!-- Info Card -->
                <div
                  class="bg-[#f8f6f0] p-10 w-full aspect-[3/4] flex flex-col items-center justify-center text-center border border-neutral-200 shadow-xl transition-colors duration-500"
                  id="event-info-card"
                >
                  <h3 id="event-title" class="text-3xl font-serif mb-4"></h3>
                  <p
                    id="event-time"
                    class="text-sm tracking-widest mb-2 text-neutral-500"
                  ></p>
                  <p
                    id="event-location"
                    class="text-sm font-light text-neutral-600"
                  ></p>
                </div>
              </div>
              <!-- Empty Left Col -->
              <div></div>
            </div>
          </div>

          <!-- Scrolling Rows -->
          <div
            class="relative z-10 w-full container mx-auto px-0 pt-[4vh] pb-[2vh]"
          >
            <!-- Row 1 -->
            <div
              class="event-row grid grid-cols-3 gap-4 items-center w-full mb-8"
              data-bg-color="#f8f6f0"
            >
              <!-- Left Image -->
              <div class="col-span-1">
                <div
                  class="w-full aspect-[3/4] bg-neutral-200 relative group overflow-hidden shadow-lg"
                >
                  <div
                    class="parallax-img-left absolute inset-[-15%_0] bg-[#e6e2dd] flex items-center justify-center transition-opacity duration-700"
                  >
                    <span
                      class="text-neutral-400 font-serif italic text-sm text-center px-4"
                      >Memories of Grace</span
                    >
                  </div>
                </div>
              </div>

              <!-- Center Spacer -->
              <div class="col-span-1"></div>

              <!-- Right Image -->
              <div class="col-span-1">
                <div
                  class="w-full aspect-[3/4] bg-neutral-200 relative group overflow-hidden shadow-lg"
                >
                  <div
                    class="parallax-img-right absolute inset-[-15%_0] bg-[#d5cfc7] flex items-center justify-center transition-opacity duration-700"
                  >
                    <span
                      class="text-neutral-500 font-serif italic text-lg text-center px-4"
                      >Sacred Vows</span
                    >
                  </div>
                </div>
              </div>
            </div>

            <!-- Row 2 -->
            <div
              class="event-row grid grid-cols-3 gap-4 items-center w-full mb-8"
              data-bg-color="#f0f2f5"
            >
              <!-- Left Image  -->
              <div class="col-span-1">
                <div
                  class="w-full aspect-[3/4] bg-neutral-200 relative group overflow-hidden shadow-lg"
                >
                  <div
                    class="parallax-img-left absolute inset-[-15%_0] bg-[#3a444d] flex items-center justify-center transition-opacity duration-700"
                  >
                    <span
                      class="text-neutral-300 font-serif italic text-sm text-center px-4"
                      >Grand Celebration</span
                    >
                  </div>
                </div>
              </div>

              <!-- Center Spacer -->
              <div class="col-span-1"></div>

              <!-- Right Image -->
              <div class="col-span-1">
                <div
                  class="w-full aspect-[3/4] bg-neutral-200 relative group overflow-hidden shadow-lg"
                >
                  <div
                    class="parallax-img-right absolute inset-[-15%_0] bg-[#2a3239] flex items-center justify-center transition-opacity duration-700"
                  >
                    <span
                      class="text-neutral-400 font-serif italic text-lg text-center px-4"
                      >Dancing Hearts</span
                    >
                  </div>
                </div>
              </div>
            </div>

            <!-- Row 3 -->
            <div
              class="event-row grid grid-cols-3 gap-4 items-center w-full mb-8"
              data-bg-color="#e8e9eb"
            >
              <!-- Left Image  -->
              <div class="col-span-1">
                <div
                  class="w-full aspect-[3/4] bg-neutral-200 relative group overflow-hidden shadow-lg"
                >
                  <div
                    class="parallax-img-left absolute inset-[-15%_0] bg-[#2d3a3a] flex items-center justify-center transition-opacity duration-700"
                  >
                    <span
                      class="text-neutral-300 font-serif italic text-sm text-center px-4"
                      >Moonlight Toast</span
                    >
                  </div>
                </div>
              </div>

              <!-- Center Spacer -->
              <div class="col-span-1"></div>

              <!-- Right Image -->
              <div class="col-span-1">
                <div
                  class="w-full aspect-[3/4] bg-neutral-200 relative group overflow-hidden shadow-lg"
                >
                  <div
                    class="parallax-img-right absolute inset-[-15%_0] bg-[#1f2929] flex items-center justify-center transition-opacity duration-700"
                  >
                    <span
                      class="text-neutral-400 font-serif italic text-lg text-center px-4"
                      >Eternal Love</span
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Music Toggle Button -->
    <button
      id="music_toggle"
      class="paused fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-transparent group outline-none"
    >
      <div
        class="relative flex items-center justify-center w-10 h-10 rounded-full bg-black/40 border border-white/20 backdrop-blur-md shadow-lg overflow-hidden"
      >
        <!-- Music Disc -->
        <svg
          class="vinyl-icon w-5 h-5 text-white/90"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          viewBox="0 0 24 24"
        >
          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="2"
          />
          <circle
            cx="12"
            cy="12"
            r="3"
            stroke="currentColor"
            fill="currentColor"
          />
          <path
            d="M12 3v3m0 12v3m9-9h-3M6 12H3m13.364-6.364l-2.121 2.121m-8.486 8.486l-2.121 2.121m12.728 0l-2.121-2.121M6.343 6.343l2.121 2.121"
            stroke-width="1"
            opacity="0.5"
          />
        </svg>
      </div>

      <!-- Efek Sound Wave & Label -->
      <div class="flex flex-col items-start justify-center gap-1">
        <svg
          id="audio-wave"
          width="60"
          height="20"
          viewBox="0 0 60 20"
          class="overflow-visible"
        >
          <path
            id="wave-path"
            d="M 0 10 L 60 10"
            fill="none"
            stroke="white"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span
          class="text-[9px] text-white/70 tracking-widest font-light"
          id="music_label"
          >SOUND OFF</span
        >
      </div>
    </button>

    <!--Audio -->
    <audio id="bg-music" loop>
      <source
        src="assets/audio/Christina Perri - A Thousand Years Piano.mp3"
        type="audio/mpeg"
      />
    </audio>
  </body>
</html>
